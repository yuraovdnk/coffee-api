name: PR Checks
on:
  workflow_call:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22,24,26]
        include:
          - node-version: 24
            experimental: true
      fail-fast: false
    continue-on-error: ${{ matrix.experimental == true }}
    steps:
      - uses: actions/checkout@v4

      - name: Cache node_modules
        uses: actions/cache@v4
        with: 
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - uses: actions/setup-node@v4
        with: 
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - name: До npm ci
        run: |
          ls node_modules | wc -l
          touch node_modules/metka.txt
      - name: Установка зависимостей
        run: npm ci
      - name: После npm ci
        run: ls node_modules/metka.txt || echo "МЕТКИ НЕТ"
      - name: Линтинг
        run: npm run lint
      - name: Запуск тестов
        run: npm run test