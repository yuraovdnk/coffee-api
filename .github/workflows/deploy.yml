name: CI Pipeline
on:
  push:
    branches: [main]  

jobs:
  checks: 
    uses: ./.github/workflows/pr-checks.yml
  deploy:
    needs: checks
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Сборка docker image
        run: docker build -t ${{secrets.DOCKER_USER}}/my-app:${{github.sha}} .
      - name: Вход в Docker Hub
        run: echo ${{secrets.DOCKER_PASSWORD}} | docker login -u ${{secrets.DOCKER_USER}} --password-stdin
      - name : Публикация Docker image
        run: docker push ${{secrets.DOCKER_USER}}/my-app:${{github.sha}}
      - name: Деплой на сервер
        uses: appleboy/ssh-action@v0.1.6
        with: 
          host: ${{secrets.SSH_HOST }}
          username: ${{secrets.SERVER_USER}}
          key: ${{secrets.SSH_PRIVATE_KEY}}
          script: |
            docker pull ${{secrets.DOCKER_USER}}/my-app:${{github.sha}}
            docker run -d --rm --name my-app -p 4000:3000 ${{secrets.DOCKER_USER}}/my-app:${{github.sha}}
        