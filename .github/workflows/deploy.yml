name: CI Pipeline
on:
  push:
    branches: [main]  

jobs:
  checks: 
    uses: ./.github/workflows/pr-checks.yml
  build :
    needs: checks
    runs-on: ubuntu-latest
    env: 
      DOCKER_USER: ${{secrets.DOCKER_USER}}
      DOCKER_PASS: ${{secrets.DOCKER_PASSWORD}}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Вход в Docker Hub
        run: echo ${{secrets.DOCKER_PASS}} | docker login -u "$DOCKER_USER" --password-stdin

      - name: Build and push Docker image
        env: 
          IMAGE_SHA: ${{$DOCKER_USER"/my-app:${{github.sha}}"}}
          IMAGE_LATEST : ${{"$DOCKER_USER"/my-app:latest}}
        run: |
          docker build -t $IMAGE_SHA -t $IMAGE_LATEST .
          docker push $IMAGE_SHA
          docker push $IMAGE_LATEST


